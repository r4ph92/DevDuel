name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only ever needs to read the code.
permissions:
  contents: read

# A new push to the same branch cancels the run that is already going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Figures out which parts of the repo exist yet, so CI stays green
  # before the Go and web code have been written.
  detect:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
      web: ${{ steps.check.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f go.mod ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f web/package.json ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

  go:
    needs: detect
    if: needs.detect.outputs.go == 'true'
    runs-on: ubuntu-latest

    # The schema tests skip themselves when there is no database, so without
    # this job's Postgres they would go quietly green while never running.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: devduel
          POSTGRES_PASSWORD: devduel
          POSTGRES_DB: devduel
        ports:
          - 5432:5432
        # The job starts as soon as the container does, which is well before
        # Postgres accepts connections.
        options: >-
          --health-cmd "pg_isready -U devduel -d devduel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Throwaway credentials for a database that exists for one job. Each
      # test clones its own database off this one.
      DATABASE_URL: postgres://devduel:devduel@localhost:5432/devduel?sslmode=disable

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race -coverprofile=coverage.out
      # v8 is the action line that speaks golangci-lint v2; the version is
      # pinned so a lint release cannot turn a green branch red on its own.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

  web:
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build --if-present
      - run: npm test --if-present

  # One stable check name for branch protection to require. Jobs above can
  # come and go without ever touching the protection rule.
  ci:
    needs: [detect, go, web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "A required job failed."
            exit 1
          fi
          if [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "A required job was cancelled."
            exit 1
          fi
          echo "All checks passed."

# Fixture challenge. Small on purpose: it exercises the loader, it is not a
# challenge anyone plays. The real ones live in /challenges.
id: todo-api
version: 1
category: debugging
difficulty: medium
duration: 45m

image:
  tag: devduel/todo-api:1

app:
  command: ["node", "server.js"]
  port: 3000

tester:
  command: ["pytest", "-q", "--devduel-json"]
  timeout: 90s

limits:
  cpus: 1
  memory_mb: 512
  pids: 128

requirements:
  - key: list-todos
    title: GET /todos returns every todo
    description: The list endpoint drops todos that are already completed.
    weight: 2
    broken: true

  - key: create-todo
    title: POST /todos creates a todo
    description: Creating a todo must return 201 and the stored representation.
    weight: 1

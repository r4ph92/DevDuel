# The app exits instead of listening. The tester finds nothing to talk to and
# gives up without reporting, which is how a judge run looks when a player's
# code does not start.
id: never-boots
version: 1
category: debugging
difficulty: easy
duration: 15m

image:
  tag: alpine:3

app:
  command: ["sh", "-c", "echo 'FATAL: cannot bind 0.0.0.0:3000' >&2; exit 1"]
  port: 3000

tester:
  command: ["sh", "/tests/run.sh"]
  timeout: 30s

limits:
  cpus: 1
  memory_mb: 128
  pids: 32

requirements:
  - key: first
    title: the first requirement
    description: Never reported, because the app never came up.
    broken: true
  - key: second
    title: the second requirement
    description: Never reported either.

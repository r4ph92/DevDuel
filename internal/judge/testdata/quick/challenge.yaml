# Reports immediately without touching the app, so lifecycle tests are about
# containers rather than about HTTP.
id: quick
version: 1
category: debugging
difficulty: easy
duration: 15m

image:
  tag: alpine:3

app:
  command: ["sleep", "300"]
  port: 3000

tester:
  command: ["sh", "/tests/run.sh"]
  timeout: 30s

limits:
  cpus: 1
  memory_mb: 128
  pids: 32

requirements:
  - key: first
    title: the first requirement
    description: Reported as a pass.
    broken: true
  - key: second
    title: the second requirement
    description: Reported as a failure.
